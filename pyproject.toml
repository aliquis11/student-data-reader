[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "student-data-reader"
version = "0.2.0"
description = "Tools for reading student marksheet and attendance data"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "openpyxl",
]

[tool.setuptools.packages.find]
include = ["student_data_reader*"]